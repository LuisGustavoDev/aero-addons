name: Verify
description: Lint, type-check, test, build and smoke-test the site.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Lint
      shell: bash
      run: npm run lint

    - name: Type-check
      shell: bash
      run: npm run typecheck

    - name: Unit tests
      shell: bash
      run: npm test

    - name: Production build
      shell: bash
      run: npm run build

    - name: Smoke test the production build
      shell: bash
      run: |
        npx next start -p 3000 > next.log 2>&1 &
        for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:3000/about && break; sleep 1; done
        node scripts/smoke-test.mjs http://localhost:3000 || (cat next.log; exit 1)
