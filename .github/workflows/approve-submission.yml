name: Apply approved submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    # Only maintainers can add labels, so the "approved" label is the review gate.
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      # Approved data goes straight to main, the branch Vercel deploys.
      # Merge main back into develop afterwards to keep Git Flow in sync.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply submission
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          node scripts/apply-submission.mjs > result.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat result.txt

      - name: Commit data change
        if: steps.apply.outputs.code == '0'
        run: |
          git config user.name "aeroaddons-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore(data): aplica envio #${{ github.event.issue.number }}"
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN don't start other workflows, so the
      # production deploy (which re-runs every check first) is started by hand.
      - name: Deploy the change
        if: steps.apply.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Report back on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          CODE: ${{ steps.apply.outputs.code }}
        run: |
          if [ "$CODE" = "0" ]; then
            gh issue comment "$NUMBER" --body "Applied: $(cat result.txt) It will appear after the next deploy."
            gh issue close "$NUMBER"
          else
            gh issue comment "$NUMBER" --body "Not applied automatically: $(cat result.txt)"
          fi
