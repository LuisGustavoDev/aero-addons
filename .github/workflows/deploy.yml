name: Deploy to production

# Every push to main goes to production, but only after the full check passes.
# If the live site fails its smoke test after deploying, it rolls back.
on:
  push:
    branches: [main]
  # Used by approve-submission.yml: pushes made with GITHUB_TOKEN don't trigger
  # workflows on their own.
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel settings
        run: npx vercel@64 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx vercel@64 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Remember the deployment currently live
        id: previous
        continue-on-error: true
        run: |
          npx vercel@64 inspect "${{ vars.PRODUCTION_URL }}" --json --token=${{ secrets.VERCEL_TOKEN }} > previous.json
          echo "id=$(node -p 'const d = require("./previous.json"); d.id ?? d.uid ?? ""')" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: npx vercel@64 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Smoke test production
        id: smoke
        run: |
          sleep 10
          node scripts/smoke-test.mjs "${{ vars.PRODUCTION_URL }}"

      - name: Roll back if production is broken
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.id != ''
        run: npx vercel@64 rollback "${{ steps.previous.outputs.id }}" --yes --token=${{ secrets.VERCEL_TOKEN }}
