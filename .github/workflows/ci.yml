name: CI

# Runs the full check on every pull request and on pushes to develop and
# feature branches. Production deploys run the same check in deploy.yml.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, "feature/**", "hotfix/**", "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
